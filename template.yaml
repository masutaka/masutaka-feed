AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Managed by AWS SAM

Parameters:
  BedrockEnabled:
    Type: String
    Description: "Whether Notifier functions invoke Bedrock"
    AllowedValues: ["true", "false"]
  GitHubFeedUrl:
    Type: String
    Description: "GitHub feed URL with token"
    NoEcho: true
  GithubTitleIgnoreRegexp:
    Type: String
    Description: "Regexp for titles of entries not to post"
    NoEcho: true
  GithubUrlIgnoreRegexp:
    Type: String
    Description: "Regexp for URLs of entries not to post"
    NoEcho: true
  GithubTitlePushoverRegexp:
    Type: String
    Description: "Regexp for titles of entries also sent to Pushover"
  HatebuFeedUrl:
    Type: String
    Description: "Hatebu feed URL with key"
    NoEcho: true
  PushoverAppToken:
    Type: String
    Description: "Pushover API application token"
    NoEcho: true
  PushoverUserKey:
    Type: String
    Description: "Pushover API user key"
    NoEcho: true
  MastodonUrl:
    Type: String
    Description: "Mastodon instance URL"
  MastodonAccessToken:
    Type: String
    Description: "Mastodon API access token"
    NoEcho: true

Mappings:
  Bedrock:
    # Notifier の関数で文を作るモデル。GitHubNotifierFunction ではリポジトリの紹介文を、HatebuNotifierFunction では記事の要約を作る
    # https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
    # Claude Haiku 5.5 はこのアカウントではまだ使えない（not available for this account）ため、使えるようになるまで Haiku 4.5 にする
    Notifier:
      ModelId: anthropic.claude-haiku-4-5-20251001-v1:0

# More info about Globals: https://github.com/aws/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Handler: index.handler
    Runtime: nodejs24.x
    MemorySize: 256 # MB (default: 128)
    Timeout: 60 # seconds (default: 3)
    Architectures:
      - arm64

Resources:
  # EventBridge Schedulers
  GitHubFeedScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: github-feed-subscriber-schedule
      Description: Periodically invokes GitHubFeedSubscriberFunction
      ScheduleExpression: "rate(5 minutes)"
      Target:
        Arn: !GetAtt GitHubFeedSubscriberFunction.Arn
        RoleArn: !GetAtt GitHubFeedSchedulerRole.Arn
      FlexibleTimeWindow:
        Mode: "OFF"
      State: "ENABLED"
  HatebuFeedScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: hatebu-feed-subscriber-schedule
      Description: Periodically invokes HatebuFeedSubscriberFunction
      ScheduleExpression: "rate(15 minutes)"
      Target:
        Arn: !GetAtt HatebuFeedSubscriberFunction.Arn
        RoleArn: !GetAtt HatebuFeedSchedulerRole.Arn
      FlexibleTimeWindow:
        Mode: "OFF"
      State: "ENABLED"

  # EventBridge Scheduler IAM Roles
  GitHubFeedSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows EventBridge Scheduler to invoke GitHubFeedSubscriberFunction
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GitHubFeedSubscriberFunction.Arn
  HatebuFeedSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows EventBridge Scheduler to invoke HatebuFeedSubscriberFunction
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt HatebuFeedSubscriberFunction.Arn

  # Feed Subscriber Lambda Functions
  GitHubFeedSubscriberFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - index.ts
    Properties:
      CodeUri: github/subscriber/
      Description: GitHub feed subscriber Lambda function
      Environment:
        Variables:
          FEED_URL: !Ref GitHubFeedUrl
          STATE_TABLE_NAME: !Ref GitHubStateTable
          QUEUE_URL: !Ref GitHubQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GitHubStateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt GitHubQueue.QueueName
  HatebuFeedSubscriberFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - index.ts
    Properties:
      CodeUri: hatebu/subscriber/
      Description: Hatebu feed subscriber Lambda function
      Environment:
        Variables:
          FEED_URL: !Ref HatebuFeedUrl
          STATE_TABLE_NAME: !Ref HatebuStateTable
          QUEUE_URL: !Ref HatebuQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HatebuStateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt HatebuQueue.QueueName

  # SQS FIFO Queues
  GitHubQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: github.fifo
      FifoQueue: true
      VisibilityTimeout: 450 # seconds. AWS recommends at least 6 times the notifier timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GitHubDeadLetterQueue.Arn
        maxReceiveCount: 5
  GitHubDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: github-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600 # 14 days (maximum)
  HatebuQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hatebu.fifo
      FifoQueue: true
      VisibilityTimeout: 360 # seconds. AWS recommends at least 6 times the notifier timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HatebuDeadLetterQueue.Arn
        maxReceiveCount: 5
  HatebuDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hatebu-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600 # 14 days (maximum)

  # DynamoDB Tables
  GitHubStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: github-state
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: entry_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: entry_id
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  HatebuStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hatebu-state
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: entry_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: entry_id
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Feed Notifier Lambda Functions
  GitHubNotifierFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - index.ts
    Properties:
      CodeUri: github/notifier/
      # Globals の60秒のままにしないのは、Pushover を最大10秒待つ分だけ Mastodon の投稿に使える時間が減るため
      # README の取得と Bedrock の呼び出しにも github/notifier/introduction.ts でタイムアウトを設けて、この時間に収めている
      Timeout: 75 # seconds
      Events:
        GitHubQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt GitHubQueue.Arn
            BatchSize: 1
      Description: GitHub feed notifier Lambda function
      Environment:
        Variables:
          BEDROCK_ENABLED: !Ref BedrockEnabled
          BEDROCK_MODEL_ID: !Sub
            - "global.${ModelId}"
            - ModelId: !FindInMap [Bedrock, Notifier, ModelId]
          ITEM_TITLE_IGNORE_REGEXP: !Ref GithubTitleIgnoreRegexp
          ITEM_URL_IGNORE_REGEXP: !Ref GithubUrlIgnoreRegexp
          ITEM_TITLE_PUSHOVER_REGEXP: !Ref GithubTitlePushoverRegexp
          PUSHOVER_APP_TOKEN: !Ref PushoverAppToken
          PUSHOVER_USER_KEY: !Ref PushoverUserKey
          MASTODON_URL: !Ref MastodonUrl
          MASTODON_ACCESS_TOKEN: !Ref MastodonAccessToken
      Policies:
        - !Ref BedrockInvokeModelPolicy
  HatebuNotifierFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - index.ts
    Properties:
      CodeUri: hatebu/notifier/
      # Globals の60秒から延ばさないのは、記事の取得と Bedrock の呼び出しに hatebu/notifier/summary.ts でタイムアウトを設けて収めているため
      Events:
        HatebuQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt HatebuQueue.Arn
            BatchSize: 1
      Description: Hatebu feed notifier Lambda function
      Environment:
        Variables:
          BEDROCK_ENABLED: !Ref BedrockEnabled
          BEDROCK_MODEL_ID: !Sub
            - "global.${ModelId}"
            - ModelId: !FindInMap [Bedrock, Notifier, ModelId]
          PUSHOVER_APP_TOKEN: !Ref PushoverAppToken
          PUSHOVER_USER_KEY: !Ref PushoverUserKey
          MASTODON_URL: !Ref MastodonUrl
          MASTODON_ACCESS_TOKEN: !Ref MastodonAccessToken
      Policies:
        - !Ref BedrockInvokeModelPolicy

  # Global cross-Region inference に必要な3つの ARN だけを許可する
  # https://docs.aws.amazon.com/bedrock/latest/userguide/global-cross-region-inference.html
  BedrockInvokeModelPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows Notifier functions to invoke the Bedrock model via Global cross-Region inference
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GrantGlobalCrisInferenceProfileRegionAccess
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub
              - "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${ModelId}"
              - ModelId: !FindInMap [Bedrock, Notifier, ModelId]
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: GrantGlobalCrisInferenceProfileInRegionModelAccess
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub
              - "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
              - ModelId: !FindInMap [Bedrock, Notifier, ModelId]
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
                bedrock:InferenceProfileArn: !Sub
                  - "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${ModelId}"
                  - ModelId: !FindInMap [Bedrock, Notifier, ModelId]
          - Sid: GrantGlobalCrisInferenceProfileGlobalModelAccess
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub
              - "arn:${AWS::Partition}:bedrock:::foundation-model/${ModelId}"
              - ModelId: !FindInMap [Bedrock, Notifier, ModelId]
            Condition:
              StringEquals:
                aws:RequestedRegion: unspecified
                bedrock:InferenceProfileArn: !Sub
                  - "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.${ModelId}"
                  - ModelId: !FindInMap [Bedrock, Notifier, ModelId]

  # CloudWatch Logs Log Groups
  GitHubFeedSubscriberLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GitHubFeedSubscriberFunction}
      RetentionInDays: 400
  HatebuFeedSubscriberLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HatebuFeedSubscriberFunction}
      RetentionInDays: 400
  GitHubNotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GitHubNotifierFunction}
      RetentionInDays: 400
  HatebuNotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HatebuNotifierFunction}
      RetentionInDays: 400

  # Feed Subscriber Alarms
  GitHubFeedSubscriberErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref LambdaAlarmTopic
      AlarmDescription: Any errors occurred in github-feed-subscriber
      AlarmName: github-feed-subscriber-errors
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 6
      Dimensions:
        - Name: FunctionName
          Value: !Ref GitHubFeedSubscriberFunction
      EvaluationPeriods: 6
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300 # 5 minutes
      Statistic: Sum
      Threshold: 0
      TreatMissingData: ignore
  HatebuFeedSubscriberErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref LambdaAlarmTopic
      AlarmDescription: Any errors occurred in hatebu-feed-subscriber
      AlarmName: hatebu-feed-subscriber-errors
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 3
      Dimensions:
        - Name: FunctionName
          Value: !Ref HatebuFeedSubscriberFunction
      EvaluationPeriods: 3
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 900 # 15 minutes
      Statistic: Sum
      Threshold: 0
      TreatMissingData: ignore

  # Dead Letter Queue Alarms
  GitHubDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref LambdaAlarmTopic
      AlarmDescription: Messages arrived in github-dlq.fifo
      AlarmName: github-dead-letter-queue-messages
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: QueueName
          Value: !GetAtt GitHubDeadLetterQueue.QueueName
      EvaluationPeriods: 1
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Period: 300 # 5 minutes
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: ignore
  HatebuDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref LambdaAlarmTopic
      AlarmDescription: Messages arrived in hatebu-dlq.fifo
      AlarmName: hatebu-dead-letter-queue-messages
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: QueueName
          Value: !GetAtt HatebuDeadLetterQueue.QueueName
      EvaluationPeriods: 1
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Period: 300 # 5 minutes
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: ignore

  # CloudWatch Dashboard
  FeedDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: app
      DashboardBody: !Sub
        - |
          {
            "start": "-P3M",
            "periodOverride": "auto",
            "widgets": [
              {
                "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "Lambda / Errors / GitHubFeedSubscriber",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "annotations": { "alarms": ["${GitHubFeedSubscriberErrorAlarm.Arn}"] }
                }
              },
              {
                "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
                "properties": {
                  "title": "SQS / DLQ Messages / GitHub",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "annotations": { "alarms": ["${GitHubDeadLetterQueueAlarm.Arn}"] }
                }
              },
              {
                "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "Lambda / Errors / HatebuFeedSubscriber",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "annotations": { "alarms": ["${HatebuFeedSubscriberErrorAlarm.Arn}"] }
                }
              },
              {
                "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
                "properties": {
                  "title": "SQS / DLQ Messages / Hatebu",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "annotations": { "alarms": ["${HatebuDeadLetterQueueAlarm.Arn}"] }
                }
              },
              {
                "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
                "properties": {
                  "title": "Lambda / Invocations Sum",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "legend": { "position": "bottom" },
                  "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Invocations", "FunctionName", "${GitHubFeedSubscriberFunction}", { "stat": "Sum", "region": "${AWS::Region}", "label": "GitHubFeedSubscriber" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${GitHubNotifierFunction}", { "stat": "Sum", "region": "${AWS::Region}", "label": "GitHubNotifier" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${HatebuFeedSubscriberFunction}", { "stat": "Sum", "region": "${AWS::Region}", "label": "HatebuFeedSubscriber" }],
                    ["AWS/Lambda", "Invocations", "FunctionName", "${HatebuNotifierFunction}", { "stat": "Sum", "region": "${AWS::Region}", "label": "HatebuNotifier" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
                "properties": {
                  "title": "Lambda / Errors Sum",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "legend": { "position": "bottom" },
                  "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Errors", "FunctionName", "${GitHubFeedSubscriberFunction}", { "stat": "Sum", "label": "GitHubFeedSubscriber" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${GitHubNotifierFunction}", { "stat": "Sum", "label": "GitHubNotifier" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${HatebuFeedSubscriberFunction}", { "stat": "Sum", "label": "HatebuFeedSubscriber" }],
                    ["AWS/Lambda", "Errors", "FunctionName", "${HatebuNotifierFunction}", { "stat": "Sum", "label": "HatebuNotifier" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 18, "width": 12, "height": 6,
                "properties": {
                  "title": "Lambda / Duration Average",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "legend": { "position": "bottom" },
                  "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Duration", "FunctionName", "${GitHubFeedSubscriberFunction}", { "label": "GitHubFeedSubscriber" }],
                    ["AWS/Lambda", "Duration", "FunctionName", "${GitHubNotifierFunction}", { "label": "GitHubNotifier" }],
                    ["AWS/Lambda", "Duration", "FunctionName", "${HatebuFeedSubscriberFunction}", { "label": "HatebuFeedSubscriber" }],
                    ["AWS/Lambda", "Duration", "FunctionName", "${HatebuNotifierFunction}", { "label": "HatebuNotifier" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 18, "width": 12, "height": 6,
                "properties": {
                  "title": "Lambda / Throttles Sum",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "legend": { "position": "bottom" },
                  "period": 300,
                  "metrics": [
                    ["AWS/Lambda", "Throttles", "FunctionName", "${GitHubFeedSubscriberFunction}", { "stat": "Sum", "label": "GitHubFeedSubscriber" }],
                    ["AWS/Lambda", "Throttles", "FunctionName", "${GitHubNotifierFunction}", { "stat": "Sum", "label": "GitHubNotifier" }],
                    ["AWS/Lambda", "Throttles", "FunctionName", "${HatebuFeedSubscriberFunction}", { "stat": "Sum", "label": "HatebuFeedSubscriber" }],
                    ["AWS/Lambda", "Throttles", "FunctionName", "${HatebuNotifierFunction}", { "stat": "Sum", "label": "HatebuNotifier" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 24, "width": 12, "height": 6,
                "properties": {
                  "title": "DynamoDB / ConsumedReadCapacityUnits Sum",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "period": 300,
                  "legend": { "position": "bottom" },
                  "metrics": [
                    ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${GitHubStateTable}", { "stat": "Sum", "label": "github" }],
                    ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${HatebuStateTable}", { "stat": "Sum", "label": "hatebu" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 24, "width": 12, "height": 6,
                "properties": {
                  "title": "DynamoDB / ConsumedWriteCapacityUnits Sum",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "period": 300,
                  "legend": { "position": "bottom" },
                  "metrics": [
                    ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${GitHubStateTable}", { "stat": "Sum", "label": "github" }],
                    ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${HatebuStateTable}", { "stat": "Sum", "label": "hatebu" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 30, "width": 12, "height": 6,
                "properties": {
                  "title": "DynamoDB / PutItem cumulative count",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "period": 3600,
                  "legend": { "position": "bottom" },
                  "metrics": [
                    [{ "expression": "RUNNING_SUM(m1)", "label": "github", "id": "e1" }],
                    ["AWS/DynamoDB", "SuccessfulRequestLatency", "TableName", "${GitHubStateTable}", "Operation", "PutItem", { "stat": "SampleCount", "id": "m1", "visible": false }],
                    [{ "expression": "RUNNING_SUM(m2)", "label": "hatebu", "id": "e2" }],
                    ["AWS/DynamoDB", "SuccessfulRequestLatency", "TableName", "${HatebuStateTable}", "Operation", "PutItem", { "stat": "SampleCount", "id": "m2", "visible": false }]
                  ],
                  "yAxis": { "left": { "label": "Count", "showUnits": false } }
                }
              },
              {
                "type": "metric", "x": 12, "y": 30, "width": 12, "height": 6,
                "properties": {
                  "title": "Bedrock / Invocations and Errors Sum / Notifiers",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "period": 86400,
                  "legend": { "position": "bottom" },
                  "metrics": [
                    ["AWS/Bedrock", "Invocations", "ModelId", "global.${ModelId}", { "stat": "Sum", "label": "Invocations" }],
                    ["AWS/Bedrock", "InvocationClientErrors", "ModelId", "global.${ModelId}", { "stat": "Sum", "label": "ClientErrors" }],
                    ["AWS/Bedrock", "InvocationServerErrors", "ModelId", "global.${ModelId}", { "stat": "Sum", "label": "ServerErrors" }],
                    ["AWS/Bedrock", "InvocationThrottles", "ModelId", "global.${ModelId}", { "stat": "Sum", "label": "Throttles" }]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 36, "width": 12, "height": 6,
                "properties": {
                  "title": "Bedrock / Tokens Sum / Notifiers",
                  "view": "timeSeries",
                  "stacked": false,
                  "region": "${AWS::Region}",
                  "period": 86400,
                  "legend": { "position": "bottom" },
                  "metrics": [
                    ["AWS/Bedrock", "InputTokenCount", "ModelId", "global.${ModelId}", { "stat": "Sum", "label": "Input" }],
                    ["AWS/Bedrock", "OutputTokenCount", "ModelId", "global.${ModelId}", { "stat": "Sum", "label": "Output" }]
                  ]
                }
              }
            ]
          }
        - ModelId: !FindInMap [Bedrock, Notifier, ModelId]

  # SNS Topic for Lambda Alarms
  # Note: SNS Subscription (email) is manually configured via AWS Console
  LambdaAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: lambda-alarms
      DisplayName: Masutaka Feed Lambda Alarm Notifications
  # CloudWatch アラームと MonthlyCostBudget から lambda-alarms トピックへ publish できるようにする。通知はトピックのメール購読に届く
  # トピックポリシーはデフォルトのポリシーを置き換えるため、CloudWatch の許可も書く必要がある
  # https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Notify_Users_Alarm_Changes.html
  # https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-sns-policy.html
  LambdaAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref LambdaAlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudWatchSNSPublishingPermissions
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref LambdaAlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                # CloudWatch の公式の例に沿って、アカウントのアラームをまとめて許可する
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*"
          - Sid: AWSBudgetsSNSPublishingPermissions
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref LambdaAlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:budgets::${AWS::AccountId}:*"

  # Budget
  # Bedrock の費用が想定を超えたら気づけるようにする。専用の AWS アカウントのため、アカウント全体の費用を対象にする
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    # SNS トピックへの publish が許可される前に作ると、Invalid SNS topic で失敗するため
    DependsOn: LambdaAlarmTopicPolicy
    Properties:
      Budget:
        BudgetName: monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100 # percent
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref LambdaAlarmTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100 # percent
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref LambdaAlarmTopic

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Managed by AWS SAM

Parameters:
  GitHubFeedUrl:
    Type: String
    Description: "GitHub feed URL with token"
    NoEcho: true
  GithubTitleIgnoreRegexp:
    Type: String
    Description: "Regexp for titles of entries not to post"
    NoEcho: true
  GithubUrlIgnoreRegexp:
    Type: String
    Description: "Regexp for URLs of entries not to post"
    NoEcho: true
  GithubTitlePushoverRegexp:
    Type: String
    Description: "Regexp for titles of entries also sent to Pushover"
  HatebuFeedUrl:
    Type: String
    Description: "Hatebu feed URL with key"
    NoEcho: true
  PushoverAppToken:
    Type: String
    Description: "Pushover API application token"
    NoEcho: true
  PushoverUserKey:
    Type: String
    Description: "Pushover API user key"
    NoEcho: true
  MastodonUrl:
    Type: String
    Description: "Mastodon instance URL"
  MastodonAccessToken:
    Type: String
    Description: "Mastodon API access token"
    NoEcho: true

# More info about Globals: https://github.com/aws/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Handler: index.handler
    Runtime: nodejs24.x
    MemorySize: 256 # MB (default: 128)
    Timeout: 60 # seconds (default: 3)
    Architectures:
      - arm64

Resources:
  # EventBridge Schedulers
  GitHubFeedScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: github-feed-subscriber-schedule
      Description: Periodically invokes GitHubFeedSubscriberFunction
      ScheduleExpression: "rate(5 minutes)"
      Target:
        Arn: !GetAtt GitHubFeedSubscriberFunction.Arn
        RoleArn: !GetAtt GitHubFeedSchedulerRole.Arn
      FlexibleTimeWindow:
        Mode: "OFF"
      State: "ENABLED"
  HatebuFeedScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: hatebu-feed-subscriber-schedule
      Description: Periodically invokes HatebuFeedSubscriberFunction
      ScheduleExpression: "rate(15 minutes)"
      Target:
        Arn: !GetAtt HatebuFeedSubscriberFunction.Arn
        RoleArn: !GetAtt HatebuFeedSchedulerRole.Arn
      FlexibleTimeWindow:
        Mode: "OFF"
      State: "ENABLED"

  # EventBridge Scheduler IAM Roles
  GitHubFeedSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows EventBridge Scheduler to invoke GitHubFeedSubscriberFunction
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GitHubFeedSubscriberFunction.Arn
  HatebuFeedSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows EventBridge Scheduler to invoke HatebuFeedSubscriberFunction
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt HatebuFeedSubscriberFunction.Arn

  # Feed Subscriber Lambda Functions
  GitHubFeedSubscriberFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - index.ts
    Properties:
      CodeUri: github/subscriber/
      Description: GitHub feed subscriber Lambda function
      Environment:
        Variables:
          FEED_URL: !Ref GitHubFeedUrl
          STATE_TABLE_NAME: !Ref GitHubStateTable
          QUEUE_URL: !Ref GitHubQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GitHubStateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt GitHubQueue.QueueName
  HatebuFeedSubscriberFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - index.ts
    Properties:
      CodeUri: hatebu/subscriber/
      Description: Hatebu feed subscriber Lambda function
      Environment:
        Variables:
          FEED_URL: !Ref HatebuFeedUrl
          STATE_TABLE_NAME: !Ref HatebuStateTable
          QUEUE_URL: !Ref HatebuQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HatebuStateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt HatebuQueue.QueueName

  # SQS FIFO Queues
  GitHubQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: masutaka-feed-github.fifo
      FifoQueue: true
      VisibilityTimeout: 360 # seconds. AWS recommends at least 6 times the notifier timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GitHubDeadLetterQueue.Arn
        maxReceiveCount: 5
  GitHubDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: masutaka-feed-github-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600 # 14 days (maximum)
  HatebuQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: masutaka-feed-hatebu.fifo
      FifoQueue: true
      VisibilityTimeout: 360 # seconds. AWS recommends at least 6 times the notifier timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HatebuDeadLetterQueue.Arn
        maxReceiveCount: 5
  HatebuDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: masutaka-feed-hatebu-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600 # 14 days (maximum)

  # DynamoDB Tables
  GitHubStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: masutaka-feed-github-state
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: entry_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: entry_id
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  HatebuStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: masutaka-feed-hatebu-state
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: entry_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: entry_id
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Feed Notifier Lambda Functions
  GitHubNotifierFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - index.ts
    Properties:
      CodeUri: github/notifier/
      Events:
        GitHubQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt GitHubQueue.Arn
            BatchSize: 1
      Description: GitHub feed notifier Lambda function
      Environment:
        Variables:
          ITEM_TITLE_IGNORE_REGEXP: !Ref GithubTitleIgnoreRegexp
          ITEM_URL_IGNORE_REGEXP: !Ref GithubUrlIgnoreRegexp
          ITEM_TITLE_PUSHOVER_REGEXP: !Ref GithubTitlePushoverRegexp
          PUSHOVER_APP_TOKEN: !Ref PushoverAppToken
          PUSHOVER_USER_KEY: !Ref PushoverUserKey
          MASTODON_URL: !Ref MastodonUrl
          MASTODON_ACCESS_TOKEN: !Ref MastodonAccessToken
  HatebuNotifierFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - index.ts
    Properties:
      CodeUri: hatebu/notifier/
      Events:
        HatebuQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt HatebuQueue.Arn
            BatchSize: 1
      Description: Hatebu feed notifier Lambda function
      Environment:
        Variables:
          PUSHOVER_APP_TOKEN: !Ref PushoverAppToken
          PUSHOVER_USER_KEY: !Ref PushoverUserKey
          MASTODON_URL: !Ref MastodonUrl
          MASTODON_ACCESS_TOKEN: !Ref MastodonAccessToken

  # CloudWatch Logs Log Groups
  GitHubFeedSubscriberLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GitHubFeedSubscriberFunction}
      RetentionInDays: 400
  HatebuFeedSubscriberLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HatebuFeedSubscriberFunction}
      RetentionInDays: 400
  GitHubNotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GitHubNotifierFunction}
      RetentionInDays: 400
  HatebuNotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HatebuNotifierFunction}
      RetentionInDays: 400

  # Feed Subscriber Alarms
  GitHubFeedSubscriberErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref LambdaAlarmTopic
      AlarmDescription: Any errors occurred in github-feed-subscriber
      AlarmName: github-feed-subscriber-errors
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 6
      Dimensions:
        - Name: FunctionName
          Value: !Ref GitHubFeedSubscriberFunction
      EvaluationPeriods: 6
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300 # 5 minutes
      Statistic: Sum
      Threshold: 0
      TreatMissingData: ignore
  HatebuFeedSubscriberErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref LambdaAlarmTopic
      AlarmDescription: Any errors occurred in hatebu-feed-subscriber
      AlarmName: hatebu-feed-subscriber-errors
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 3
      Dimensions:
        - Name: FunctionName
          Value: !Ref HatebuFeedSubscriberFunction
      EvaluationPeriods: 3
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 900 # 15 minutes
      Statistic: Sum
      Threshold: 0
      TreatMissingData: ignore

  # Dead Letter Queue Alarms
  GitHubDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref LambdaAlarmTopic
      AlarmDescription: Messages arrived in masutaka-feed-github-dlq.fifo
      AlarmName: github-dead-letter-queue-messages
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: QueueName
          Value: !GetAtt GitHubDeadLetterQueue.QueueName
      EvaluationPeriods: 1
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Period: 300 # 5 minutes
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: ignore
  HatebuDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - !Ref LambdaAlarmTopic
      AlarmDescription: Messages arrived in masutaka-feed-hatebu-dlq.fifo
      AlarmName: hatebu-dead-letter-queue-messages
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 1
      Dimensions:
        - Name: QueueName
          Value: !GetAtt HatebuDeadLetterQueue.QueueName
      EvaluationPeriods: 1
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Period: 300 # 5 minutes
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: ignore

  # CloudWatch Dashboard
  FeedDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: masutaka-feed
      DashboardBody: !Sub |
        {
          "start": "-P3M",
          "periodOverride": "auto",
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda / Errors / GitHubFeedSubscriber",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "annotations": { "alarms": ["${GitHubFeedSubscriberErrorAlarm.Arn}"] }
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "SQS / DLQ Messages / GitHub",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "annotations": { "alarms": ["${GitHubDeadLetterQueueAlarm.Arn}"] }
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda / Errors / HatebuFeedSubscriber",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "annotations": { "alarms": ["${HatebuFeedSubscriberErrorAlarm.Arn}"] }
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "SQS / DLQ Messages / Hatebu",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "annotations": { "alarms": ["${HatebuDeadLetterQueueAlarm.Arn}"] }
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda / Invocations Sum",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "legend": { "position": "bottom" },
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GitHubFeedSubscriberFunction}", { "stat": "Sum", "region": "${AWS::Region}", "label": "GitHubFeedSubscriber" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GitHubNotifierFunction}", { "stat": "Sum", "region": "${AWS::Region}", "label": "GitHubNotifier" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${HatebuFeedSubscriberFunction}", { "stat": "Sum", "region": "${AWS::Region}", "label": "HatebuFeedSubscriber" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${HatebuNotifierFunction}", { "stat": "Sum", "region": "${AWS::Region}", "label": "HatebuNotifier" }]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda / Errors Sum",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "legend": { "position": "bottom" },
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${GitHubFeedSubscriberFunction}", { "stat": "Sum", "label": "GitHubFeedSubscriber" }],
                  ["AWS/Lambda", "Errors", "FunctionName", "${GitHubNotifierFunction}", { "stat": "Sum", "label": "GitHubNotifier" }],
                  ["AWS/Lambda", "Errors", "FunctionName", "${HatebuFeedSubscriberFunction}", { "stat": "Sum", "label": "HatebuFeedSubscriber" }],
                  ["AWS/Lambda", "Errors", "FunctionName", "${HatebuNotifierFunction}", { "stat": "Sum", "label": "HatebuNotifier" }]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 18, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda / Duration Average",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "legend": { "position": "bottom" },
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${GitHubFeedSubscriberFunction}", { "label": "GitHubFeedSubscriber" }],
                  ["AWS/Lambda", "Duration", "FunctionName", "${GitHubNotifierFunction}", { "label": "GitHubNotifier" }],
                  ["AWS/Lambda", "Duration", "FunctionName", "${HatebuFeedSubscriberFunction}", { "label": "HatebuFeedSubscriber" }],
                  ["AWS/Lambda", "Duration", "FunctionName", "${HatebuNotifierFunction}", { "label": "HatebuNotifier" }]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 18, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda / Throttles Sum",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "legend": { "position": "bottom" },
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Throttles", "FunctionName", "${GitHubFeedSubscriberFunction}", { "stat": "Sum", "label": "GitHubFeedSubscriber" }],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${GitHubNotifierFunction}", { "stat": "Sum", "label": "GitHubNotifier" }],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${HatebuFeedSubscriberFunction}", { "stat": "Sum", "label": "HatebuFeedSubscriber" }],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${HatebuNotifierFunction}", { "stat": "Sum", "label": "HatebuNotifier" }]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 24, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB / ConsumedReadCapacityUnits Sum",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "legend": { "position": "bottom" },
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${GitHubStateTable}", { "stat": "Sum", "label": "github" }],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${HatebuStateTable}", { "stat": "Sum", "label": "hatebu" }]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 24, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB / ConsumedWriteCapacityUnits Sum",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "legend": { "position": "bottom" },
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${GitHubStateTable}", { "stat": "Sum", "label": "github" }],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${HatebuStateTable}", { "stat": "Sum", "label": "hatebu" }]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 30, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB / PutItem cumulative count",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 3600,
                "legend": { "position": "bottom" },
                "metrics": [
                  [{ "expression": "RUNNING_SUM(m1)", "label": "github", "id": "e1" }],
                  ["AWS/DynamoDB", "SuccessfulRequestLatency", "TableName", "${GitHubStateTable}", "Operation", "PutItem", { "stat": "SampleCount", "id": "m1", "visible": false }],
                  [{ "expression": "RUNNING_SUM(m2)", "label": "hatebu", "id": "e2" }],
                  ["AWS/DynamoDB", "SuccessfulRequestLatency", "TableName", "${HatebuStateTable}", "Operation", "PutItem", { "stat": "SampleCount", "id": "m2", "visible": false }]
                ],
                "yAxis": { "left": { "label": "Count", "showUnits": false } }
              }
            }
          ]
        }

  # SNS Topic for Lambda Alarms
  # Note: SNS Subscription (email) is manually configured via AWS Console
  LambdaAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: masutaka-feed-lambda-alarms
      DisplayName: Masutaka Feed Lambda Alarm Notifications

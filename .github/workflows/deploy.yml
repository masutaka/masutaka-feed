name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ap-northeast-1
          role-duration-seconds: 900
          role-to-assume: ${{ vars.AWS_IAM_ROLE_ARN }}
          output-credentials: true # 認証情報を step outputs として出力する
          output-env-credentials: false # 認証情報を環境変数に出力せず、露出範囲を必要な step だけに狭める
      - run: make deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws-credentials.outputs.aws-session-token }}
          GH_FEED_URL: ${{ secrets.GH_FEED_URL }}
          GH_TITLE_IGNORE_REGEXP: ${{ secrets.GH_TITLE_IGNORE_REGEXP }}
          GH_URL_IGNORE_REGEXP: ${{ secrets.GH_URL_IGNORE_REGEXP }}
          GH_TITLE_PUSHOVER_REGEXP: ${{ vars.GH_TITLE_PUSHOVER_REGEXP }}
          HATEBU_FEED_URL: ${{ secrets.HATEBU_FEED_URL }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          MASTODON_URL: ${{ vars.MASTODON_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
  pushover:
    name: pushover if failure
    if: github.ref_name == github.event.repository.default_branch && failure()
    needs: [deploy]
    uses: masutaka/actions/.github/workflows/pushover.yml@main
    permissions: {}
    secrets:
      PUSHOVER_API_KEY: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
